services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: song-master-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./backend/data:/app/backend/data
      - ./personas:/app/personas
      - ./styles:/app/styles
      - ./prompts:/app/prompts
      - ./songs:/songs
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - LMSTUDIO_API_KEY=${LMSTUDIO_API_KEY}
      - LMSTUDIO_API_BASE=${LMSTUDIO_API_BASE}
      - DATABASE_URL=sqlite:///./backend/data/song_master.db
    networks:
      - song-master-network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: song-master-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - song-master-network
    restart: unless-stopped

networks:
  song-master-network:
    driver: bridge

volumes:
  backend-data:
    driver: local