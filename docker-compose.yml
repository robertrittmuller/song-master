services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: song-master-backend
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./backend/data:/app/backend/data
      - ./personas:/app/personas
      - ./styles:/app/styles
      - ./prompts:/app/prompts
      - ./songs:/app/songs
      - ./images:/app/images
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - LMSTUDIO_API_KEY=${LMSTUDIO_API_KEY}
      - LMSTUDIO_BASE_URL=${LMSTUDIO_BASE_URL}
      - DATABASE_URL=sqlite:///./backend/data/song_master.db
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: song-master-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    environment:
      - VITE_API_BASE=
    depends_on:
      - backend
    restart: unless-stopped
